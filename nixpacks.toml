# Coolify / Nixpacks — abale-school (Next.js 16 standalone)
# Use when Coolify build pack is "Nixpacks" instead of Dockerfile.
# Docs: https://coolify.io/docs/applications/build-packs/nixpacks

[variables]
NIXPACKS_NODE_VERSION = "20"
PORT = "3000"
HOSTNAME = "0.0.0.0"
NODE_ENV = "production"

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"
