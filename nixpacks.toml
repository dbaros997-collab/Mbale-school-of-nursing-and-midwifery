# Coolify: Build Pack = Docker Compose → compose.yaml (pulls GHCR, no VPS build).
# Do NOT use Dockerfile build pack on a small VPS — it hangs during next build.
# Deploy: commit on main, then run: npm run push:live
# Prefer GHCR pre-built image — see .github/workflows/publish-image.yml

[variables]
NIXPACKS_NODE_VERSION = "20"
PORT = "3000"
HOSTNAME = "0.0.0.0"

[phases.install]
cmds = ["npm ci --include=dev --no-audit --no-fund"]

[phases.build]
cmds = ["NODE_OPTIONS=--max-old-space-size=1024 npm run build"]

[start]
cmd = "NODE_ENV=production HOSTNAME=0.0.0.0 npm run start"
