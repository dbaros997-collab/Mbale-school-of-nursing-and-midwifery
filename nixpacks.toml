# Coolify: prefer Build Pack = Dockerfile (recommended).
# If you must use Nixpacks, these settings match package.json + .npmrc.

[variables]
NIXPACKS_NODE_VERSION = "20"
PORT = "3000"
HOSTNAME = "0.0.0.0"

[phases.install]
cmds = ["npm ci --include=dev --no-audit --no-fund"]

[phases.build]
cmds = ["NODE_OPTIONS=--max-old-space-size=1024 npm run build"]

[start]
cmd = "NODE_ENV=production HOSTNAME=0.0.0.0 npm run start"
