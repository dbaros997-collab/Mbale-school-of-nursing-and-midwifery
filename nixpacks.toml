# Coolify Nixpacks / Railpack — Next.js standalone on a small VPS (2 GB RAM).
# Prefer repo Dockerfile (GHCR pull) when possible; use this when building on the VPS.
# Node version: .nvmrc / .node-version / package.json engines (>=22).

[variables]
NEXT_TELEMETRY_DISABLED = "1"
CI = "true"
# Leave headroom for Docker + sharp/webpack on a 2 GB VPS (heap cap ~896 MiB).
NODE_OPTIONS = "--max-old-space-size=896"
MBSNM_SKIP_ICON_REGEN = "1"

[phases.install]
cmds = ["npm ci --no-audit --no-fund"]

[phases.build]
cmds = ["npm run build"]
cacheDirectories = [".next/cache", "node_modules/.cache"]

[start]
cmd = "npm start"
