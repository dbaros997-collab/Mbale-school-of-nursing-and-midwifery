# Coolify Build Pack = Dockerfile (root Dockerfile pulls from GHCR — no VPS build).
# Full build: Dockerfile.build via GitHub Actions on push to main.

[variables]
NIXPACKS_NODE_VERSION = "20"
PORT = "3000"
HOSTNAME = "0.0.0.0"

[phases.install]
cmds = ["npm ci --include=dev --no-audit --no-fund"]

[phases.build]
cmds = ["NODE_OPTIONS=--max-old-space-size=1024 npm run build"]

[start]
cmd = "NODE_ENV=production HOSTNAME=0.0.0.0 npm run start"
