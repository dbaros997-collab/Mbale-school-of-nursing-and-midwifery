# Build the Docker image on GitHub (7 GB RAM) and push to GHCR.
# Coolify uses the root Dockerfile (pull-only FROM GHCR) — no next build on the VPS.
name: Publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-docker-image
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[pin-coolify]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        run: echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve Microsoft build args
        id: msbuild
        env:
          NEXT_PUBLIC_AZURE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_AZURE_CLIENT_ID }}
          NEXT_PUBLIC_AZURE_TENANT_ID: ${{ vars.NEXT_PUBLIC_AZURE_TENANT_ID }}
          MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }}
          MICROSOFT_TENANT_ID: ${{ vars.MICROSOFT_TENANT_ID }}
          SECRET_AZURE_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          SECRET_AZURE_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}
        run: |
          client_id="${NEXT_PUBLIC_AZURE_CLIENT_ID:-${MICROSOFT_CLIENT_ID:-$SECRET_AZURE_CLIENT_ID}}"
          tenant_id="${NEXT_PUBLIC_AZURE_TENANT_ID:-${MICROSOFT_TENANT_ID:-$SECRET_AZURE_TENANT_ID}}"
          echo "client_id=${client_id}" >> "$GITHUB_OUTPUT"
          echo "tenant_id=${tenant_id}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.build
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mbale-school:latest
            ghcr.io/${{ github.repository_owner }}/mbale-school:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/mbale-school:${{ steps.tags.outputs.short_sha }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            NEXT_PUBLIC_AZURE_CLIENT_ID=${{ steps.msbuild.outputs.client_id }}
            NEXT_PUBLIC_AZURE_TENANT_ID=${{ steps.msbuild.outputs.tenant_id }}
            MICROSOFT_CLIENT_ID=${{ steps.msbuild.outputs.client_id }}
            MICROSOFT_TENANT_ID=${{ steps.msbuild.outputs.tenant_id }}
            NEXT_PUBLIC_AZURE_REDIRECT_URI=${{ vars.NEXT_PUBLIC_AZURE_REDIRECT_URI }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_LOGO_VERSION=${{ github.sha }}

      - name: Make GHCR package public (Coolify pull without registry login)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for url in \
            "https://api.github.com/orgs/${{ github.repository_owner }}/packages/container/mbale-school/visibility" \
            "https://api.github.com/user/packages/container/mbale-school/visibility"
          do
            curl -fsS -X PATCH \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${url}" \
              -d '{"visibility":"public"}' && break
          done

      - name: Deployment note
        run: |
          echo "Image pushed: ghcr.io/${{ github.repository_owner }}/mbale-school:latest"
          echo "Coolify redeploy is triggered once by the Redeploy Coolify workflow (after GHCR is ready)."
