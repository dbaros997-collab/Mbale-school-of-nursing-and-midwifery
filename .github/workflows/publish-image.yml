# Build the Docker image on GitHub (7 GB RAM) and push to GHCR.
# Coolify uses the root Dockerfile (pull-only FROM GHCR) — no next build on the VPS.
name: Publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-docker-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.build
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mbale-school:latest
            ghcr.io/${{ github.repository_owner }}/mbale-school:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_AZURE_CLIENT_ID=${{ vars.NEXT_PUBLIC_AZURE_CLIENT_ID }}
            NEXT_PUBLIC_AZURE_TENANT_ID=${{ vars.NEXT_PUBLIC_AZURE_TENANT_ID }}
            NEXT_PUBLIC_AZURE_REDIRECT_URI=${{ vars.NEXT_PUBLIC_AZURE_REDIRECT_URI }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Make GHCR package public (Coolify pull without registry login)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for url in \
            "https://api.github.com/orgs/${{ github.repository_owner }}/packages/container/mbale-school/visibility" \
            "https://api.github.com/user/packages/container/mbale-school/visibility"
          do
            curl -fsS -X PATCH \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${url}" \
              -d '{"visibility":"public"}' && break
          done

      - name: Trigger Coolify redeploy
        if: success()
        continue-on-error: true
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "COOLIFY_WEBHOOK not set — redeploy manually in Coolify after this workflow finishes."
            exit 0
          fi
          curl -fsS -X GET "${COOLIFY_WEBHOOK}?force=true" \
            ${COOLIFY_TOKEN:+ -H "Authorization: Bearer ${COOLIFY_TOKEN}"}
          echo "Coolify redeploy triggered."
