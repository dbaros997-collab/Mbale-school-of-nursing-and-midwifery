# Redeploy Coolify AFTER the Docker image exists on GHCR.
# Without this, Coolify's git webhook often redeploys before Actions finishes building.
name: Redeploy Coolify

on:
  workflow_run:
    workflows: ["Publish Docker image"]
    types: [completed]

jobs:
  redeploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GHCR image
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          token="$(curl -fsS "https://ghcr.io/token?service=ghcr.io&scope=repository:${OWNER}/mbale-school:pull" | jq -r .token)"
          for attempt in $(seq 1 18); do
            status="$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              "https://ghcr.io/v2/${OWNER}/mbale-school/manifests/${SHA}")"
            if [ "${status}" = "200" ]; then
              echo "GHCR image ready: ghcr.io/${OWNER}/mbale-school:${SHA}"
              exit 0
            fi
            echo "Waiting for GHCR image (${attempt}/18, HTTP ${status})..."
            sleep 10
          done
          echo "::error::Timed out waiting for ghcr.io/${OWNER}/mbale-school:${SHA}"
          exit 1

      - name: Trigger Coolify redeploy
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "Image ready for commit ${SHA}"
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "::warning::COOLIFY_WEBHOOK secret is not set. Redeploy commit ${SHA} manually in Coolify after each push."
            exit 0
          fi
          curl -fsS -X GET "${COOLIFY_WEBHOOK}?force=true" \
            ${COOLIFY_TOKEN:+ -H "Authorization: Bearer ${COOLIFY_TOKEN}"}
          echo "Coolify redeploy triggered for ${SHA}"
          echo "Expect /api/health build=${SHA} after deploy completes."
